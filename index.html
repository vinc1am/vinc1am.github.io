        <div class="shell__top">
          <h1 class="visually-hidden">Vinc1AM</h1>
          <div
            class="wordmark ascii-mosaic"
            id="ascii-mosaic"
            data-text="VINC1AM"
            data-chars="#*%=+FR3T."
            data-fade
            aria-hidden="true"
          ></div>
          <p class="welcome">Visitor, welcome to my page!</p>
          <p class="tagline">
            I am <span class="tagline__name">Vincent Lam</span>, who specialises in AI &amp; ML<br />
            Helping teams and customers turn business needs into practical solutions.
          </p>
        </div>

        <div class="shell__mid">
          <div class="slide-wrap" id="slide-wrap">
            <div class="pane-chrome">
              <p class="term-line term-line--display pane__prompt" aria-hidden="true">
                <span class="deck__prompt-user">visitor</span><span class="deck__prompt-at">@</span><span class="deck__prompt-host">vinc1am.portfolio</span><span class="deck__prompt-path">:~</span><span class="deck__prompt-sep">$</span>
                <span class="term-line__cmd" id="slide-cmd">cd ~</span>
                <span class="term-line__cursor" aria-hidden="true"></span>
              </p>

              <div class="slide-track" id="slide-track">
                <article class="pane pane--slide" data-slide-panel="projects" id="panel-projects" hidden>
                  <div class="pane__body">
                    <ul class="term-list" id="list-projects"></ul>
                  </div>
                </article>

                <article class="pane pane--slide" data-slide-panel="career" id="panel-career" hidden>
                  <div class="pane__body">
                    <ul class="term-list" id="list-career"></ul>
                  </div>
                </article>

                <article class="pane pane--slide" data-slide-panel="education" id="panel-education" hidden>
                  <div class="pane__body">
                    <ul class="term-list" id="list-education"></ul>
                  </div>
                </article>

                <article class="pane pane--slide pane--certs" data-slide-panel="certs" id="panel-certs" hidden>
                  <div class="pane__body">
                    <ul class="term-list" id="list-certs"></ul>
                  </div>
                </article>
              </div>
            </div>

            <div class="slide-dots" aria-hidden="true">
              <span class="slide-dot" data-dot="projects"></span>
              <span class="slide-dot" data-dot="career"></span>
              <span class="slide-dot" data-dot="education"></span>
              <span class="slide-dot" data-dot="certs"></span>
            </div>
          </div>
        </div>
